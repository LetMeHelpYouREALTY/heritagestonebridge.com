name: GBP Weekly Loop

on:
  schedule:
    # Sundays 17:00 UTC ≈ 10:00 AM PT — batch day per GBP advisor
    - cron: "0 17 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-weekly-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run GBP weekly generator + NAP audit
        run: npm run gbp:weekly

      - name: Run GBP unit tests
        run: npm run test:run -- lib/gbp/gbp-weekly.test.ts

      - name: Commit weekly pack if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/gbp/generated/
          if git diff --staged --quiet; then
            echo "No GBP content changes to commit."
          else
            git commit -m "chore(gbp): weekly post pack $(date -u +%Y-W%V)"
            git push
          fi
