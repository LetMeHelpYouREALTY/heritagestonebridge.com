name: Cloudflare Images Sync

# Uploads git backups in public/ to Cloudflare Images (imagedelivery.net).
# Does not orange-cloud the Vercel origin.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "public/images/**"
      - "public/Image/**"
      - "scripts/upload-cloudflare-images.mjs"
      - ".github/workflows/cloudflare-images.yml"
  workflow_dispatch:

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  upload:
    name: Upload git backups to Cloudflare Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      account_hash: ${{ steps.sync.outputs.account_hash }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN must be set in repo secrets."
            echo "Create a token with Account → Cloudflare Images → Edit at https://dash.cloudflare.com/profile/api-tokens"
            exit 1
          fi

      - name: Sync images
        id: sync
        run: node scripts/upload-cloudflare-images.mjs

  enable-vercel:
    name: Set Vercel Images env vars
    runs-on: ubuntu-latest
    needs: upload
    if: needs.upload.outputs.account_hash != ''
    steps:
      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Set NEXT_PUBLIC Cloudflare Images vars
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          HASH: ${{ needs.upload.outputs.account_hash }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN is not in repo secrets; skip Vercel env update."
            echo "Set these on the hertagestonebridge.com Vercel project:"
            echo "  NEXT_PUBLIC_CLOUDFLARE_IMAGES_ENABLED=true"
            echo "  NEXT_PUBLIC_CLOUDFLARE_ACCOUNT_HASH=$HASH"
            exit 0
          fi
          upsert() {
            local name="$1"
            local value="$2"
            local env_name="$3"
            vercel env rm "$name" "$env_name" --token "$VERCEL_TOKEN" --yes >/dev/null 2>&1 || true
            printf '%s' "$value" | vercel env add "$name" "$env_name" --token "$VERCEL_TOKEN"
          }
          for env_name in production preview development; do
            upsert NEXT_PUBLIC_CLOUDFLARE_IMAGES_ENABLED true "$env_name"
            upsert NEXT_PUBLIC_CLOUDFLARE_ACCOUNT_HASH "$HASH" "$env_name"
          done
          echo "Set Cloudflare Images env on Vercel (production, preview, development)."
          echo "The next Vercel Git deploy will serve images from imagedelivery.net."
