# Image CDN worker — R2 originals + Cloudflare Images transforms.
# This worker does NOT sit in front of the Vercel origin (gray-cloud DNS).
# Optional custom domain: images.heritagestonebridge.com (orange-cloud that
# hostname only). Until then, use the workers.dev URL in
# NEXT_PUBLIC_CLOUDFLARE_IMAGES_URL.

name = "heritagestonebridge-images"
main = "workers/images.ts"
compatibility_date = "2026-08-29"
workers_dev = true

[images]
binding = "IMAGES"

[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "heritagestonebridge-images"

[observability]
enabled = true

[dev]
port = 8787
local_protocol = "http"

# Uncomment after the zone has an images subdomain pointed at this Worker:
# [[routes]]
# pattern = "images.heritagestonebridge.com/*"
# zone_name = "heritagestonebridge.com"
